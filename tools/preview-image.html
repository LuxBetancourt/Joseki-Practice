<!DOCTYPE html>
<!--
    The link preview image (resources/preview.png), shown when the site is shared in chat apps.
    To regenerate it after editing this page, run from the repository root:
        node tools/make-preview.mjs
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Preview image</title>
<style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 0 64px;
        box-sizing: border-box;
        background: #1b1a18;
        color: #ece8df;
        font-family: "Segoe UI", system-ui, sans-serif;
    }
    .text { flex: 1; }
    h1 { margin: 0 0 18px; font-size: 76px; line-height: 1; letter-spacing: -1px; }
    p { margin: 0 0 34px; font-size: 30px; line-height: 1.35; color: #b9b3a6; }
    .types { display: flex; flex-wrap: wrap; gap: 12px; }
    .types span {
        padding: 8px 18px;
        border-radius: 999px;
        background: #2a2825;
        border: 2px solid #3a3733;
        font-size: 22px;
        font-weight: 600;
    }
    .types span:first-child { background: #2e7d4f; border-color: #2e7d4f; color: white; }
    svg { flex: none; border-radius: 14px; box-shadow: 0 10px 40px rgba(0, 0, 0, .5); }
</style>
</head>
<body>
    <div class="text">
        <h1>Joseki Practice</h1>
        <p>Drill go joseki with endless problems from Josekipedia's data.</p>
        <div class="types">
            <span>Next Move</span><span>Punish</span><span>Final Shape</span>
            <span>Pick the Path</span><span>Who's Better?</span><span>Tenuki-able?</span>
            <span>Play for Sente</span>
        </div>
    </div>
    <svg id="board" width="500" height="500" viewBox="0 0 500 500"></svg>
<script>
    // The top-right corner of a 19×19 board, with the Avalanche on it
    const svg = document.getElementById('board')
    const FIRST = 10 // Leftmost column shown (0-based, so the corner is column 18)
    const ROWS = 9
    const CELL = 54
    const ORIGIN = 34 // Position of the first line
    const ns = 'http://www.w3.org/2000/svg'
    const el = (name, attrs, parent = svg) => {
        const node = document.createElementNS(ns, name)
        for (const [key, value] of Object.entries(attrs)) { node.setAttribute(key, value) }
        parent.appendChild(node)
        return node
    }
    const px = (col) => ORIGIN + (col - FIRST) * CELL
    const py = (row) => ORIGIN + row * CELL

    const defs = el('defs', {})
    const gradient = (id, stops) => {
        const g = el('radialGradient', { id, cx: '35%', cy: '35%', r: '70%' }, defs)
        stops.forEach(([offset, color]) => el('stop', { offset, 'stop-color': color }, g))
    }
    gradient('black', [['0%', '#666'], ['100%', '#0a0a0a']])
    gradient('white', [['0%', '#ffffff'], ['100%', '#cfcac0']])

    el('rect', { width: 500, height: 500, fill: '#dcb35c' })
    // Lines run off the left and bottom edges, as the board carries on there
    for (let i = 0; i < 9; i++) {
        el('line', { x1: px(FIRST + i), y1: py(0), x2: px(FIRST + i), y2: 500, stroke: '#3b2a10', 'stroke-width': FIRST + i === 18 ? 3 : 1.6 })
        el('line', { x1: 0, y1: py(i), x2: px(18), y2: py(i), stroke: '#3b2a10', 'stroke-width': i === 0 ? 3 : 1.6 })
    }
    el('circle', { cx: px(15), cy: py(3), r: 5, fill: '#3b2a10' }) // Star point

    const moves = ['qd', 'od', 'oc', 'pd', 'pc', 'qe', 'nd', 'qc', 'rd', 'qb'] // Josekipedia's main line
    moves.forEach((move, i) => {
        const col = move.charCodeAt(0) - 97
        const row = move.charCodeAt(1) - 97
        const color = i % 2 ? 'white' : 'black'
        el('circle', { cx: px(col) + 2, cy: py(row) + 3, r: CELL * .47, fill: 'rgba(0,0,0,.3)' })
        el('circle', { cx: px(col), cy: py(row), r: CELL * .47, fill: `url(#${color})` })
        if (i === moves.length - 1) {
            el('circle', { cx: px(col), cy: py(row), r: CELL * .22, fill: 'none', stroke: color === 'black' ? 'white' : 'black', 'stroke-width': 3 })
        }
    })
</script>
</body>
</html>
