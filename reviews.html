<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Reviews · Joseki Practice</title>
    <!-- Link previews in chat apps and social sites (image: tools/make-preview.mjs) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Joseki Practice">
    <meta property="og:title" content="Saved Reviews · Joseki Practice">
    <meta property="og:description" content="Practice go joseki with endless problems built from Josekipedia.">
    <meta property="og:url" content="https://josekipractice.neocities.org/reviews.html">
    <meta property="og:image" content="https://josekipractice.neocities.org/resources/preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Joseki Practice: the Avalanche joseki on a go board, beside the six problem types">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#2e7d4f">
    <link rel="icon" href="resources/favicon.ico">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="reviews.css">
    <script type="module" src="js/reviews-page.js"></script>
    <!-- Fetch every module at once, rather than as each import is found (keep in step with js/) -->
    <link rel="modulepreload" href="js/reviews.js">
    <link rel="modulepreload" href="js/go.js">
    <link rel="modulepreload" href="js/shape-view.js">
    <link rel="modulepreload" href="js/board-view.js">
</head>
<body>
<header class="site-header reviews-header">
    <a class="back-button" href="index.html">← Back to the board</a>
    <h1>Saved Reviews</h1>
</header>

<main id="reviews-page">
    <div class="panel reviews-toolbar">
        <p id="reviews-summary"></p>
        <div class="reviews-actions">
            <button type="button" id="export-reviews" title="Save your reviews to a file, to back them up or move them to another browser">Export</button>
            <button type="button" id="import-reviews" title="Add the reviews from an exported file">Import…</button>
            <input type="file" id="import-file" accept=".json,application/json" hidden>
            <button type="button" id="remove-all">Remove all…</button>
        </div>
    </div>
    <div class="panel undo-bar" id="undo-bar" hidden>
        <span id="undo-text"></span>
        <button type="button" id="undo-remove">Undo</button>
    </div>
    <ul id="review-list"></ul>
</main>
</body>
</html>
