<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Practice go (baduk/weiqi) joseki against random variations from Josekipedia.">
    <link rel="icon" href="resources/favicon.ico">
    <title>Joseki Practice</title>
    <link rel="stylesheet" href="index.css">
    <script type="module" src="js/app.js"></script>
</head>
<body>
<header class="site-header">
    <a class="icon-link" href="about.html" title="About this site" aria-label="About this site">?</a>
    <h1>Joseki Practice</h1>
    <a class="icon-link github" href="https://github.com/LuxBetancourt/Joseki-Practice" target="_blank" rel="noopener noreferrer" title="View source on GitHub" aria-label="View source on GitHub">
        <img src="resources/GitHub-Mark-32px.png" alt="" width="20" height="20">
    </a>
</header>

<main id="layout">
    <section id="board-area" aria-label="Board">
        <div id="board-controls">
            <button type="button" id="undo" title="Undo (←)">Undo</button>
            <button type="button" id="redo" title="Redo (→)">Redo</button>
            <span id="status" role="status"></span>
            <button type="button" id="pass" title="Pass / tenuki">Pass</button>
        </div>
        <div id="problem-bar" hidden>
            <span id="problem-prompt"></span>
            <span id="score"></span>
            <button type="button" id="show-answer">Show Answer</button>
            <button type="button" id="next-problem" class="primary" title="New problem (N)">Next</button>
        </div>
        <div id="board-wrap">
            <svg id="board" role="img" aria-label="Go board"></svg>
            <div id="toasts" aria-live="polite"></div>
        </div>
        <p class="hint">Right-click a stone to return to that move.</p>
    </section>

    <aside id="setup" class="panel">
        <h2>Mode</h2>
        <div class="segmented" role="radiogroup" aria-label="Mode">
            <input type="radio" name="mode" id="mode-practice" value="practice"><label for="mode-practice" title="Play against the computer from a starting point">Practice</label>
            <input type="radio" name="mode" id="mode-next" value="next"><label for="mode-next" title="Find the joseki move from a position partway through a joseki">Next Move</label>
            <input type="radio" name="mode" id="mode-punish" value="punish"><label for="mode-punish" title="The computer makes a mistake; find the move that punishes it">Punish</label>
        </div>

        <h2>Player</h2>
        <div class="segmented" role="radiogroup" aria-label="Play as">
            <input type="radio" name="player" id="player-black" value="black"><label for="player-black">Black</label>
            <input type="radio" name="player" id="player-white" value="white"><label for="player-white">White</label>
        </div>

        <h2>Starting Point</h2>
        <form id="start-form">
            <ul class="tree" id="starting-points">
                <li><div class="tree-row"><span class="tree-spacer"></span><label><input type="radio" name="start" value="empty" checked>Empty Board</label></div></li>
                <li class="practice-only" title="Play both colors freely. The computer won't respond and no joseki info is loaded.">
                    <div class="tree-row"><span class="tree-spacer"></span><label><input type="radio" name="start" value="demo">Demo Board</label></div>
                </li>
            </ul>
            <button type="submit" id="start" class="primary">Start</button>
        </form>
    </aside>

    <aside id="options" class="panel">
        <h2 class="practice-only">Computer Plays</h2>
        <ul class="plain practice-only">
            <li><label><input type="checkbox" data-setting="ideal"> <span class="swatch ideal"></span>Ideal moves</label></li>
            <li><label><input type="checkbox" data-setting="good"> <span class="swatch good"></span>Good moves</label></li>
            <li><label><input type="checkbox" data-setting="bad"> <span class="swatch bad"></span>Bad moves</label></li>
            <li><label><input type="checkbox" data-setting="trick"> <span class="swatch trick"></span>Trick moves</label></li>
            <li><label><input type="checkbox" data-setting="question"> <span class="swatch question"></span>Questionable moves</label></li>
            <li title="Josekipedia often shows what happens if a player tenukis (plays elsewhere). With this checked, the computer only passes when tenuki is joseki.">
                <label><input type="checkbox" data-setting="onlyPassIfJoseki"> Only pass if joseki</label>
            </li>
        </ul>
        <h2>Variations</h2>
        <ul class="plain">
            <li title="Only consider the first ten continuations Josekipedia lists. Helps avoid unusual moves, like fuseki plays.">
                <label><input type="checkbox" data-setting="firstTen"> First ten variations only</label>
            </li>
        </ul>
        <h2>Display</h2>
        <ul class="plain">
            <li><label><input type="checkbox" data-setting="showMoves"> Show joseki moves <kbd>H</kbd></label></li>
            <li><label><input type="checkbox" data-setting="showMoveInfo"> Show move info</label></li>
            <li title="Shows the final shape each joseki move leads to. Loads several lines from Josekipedia per position.">
                <label><input type="checkbox" data-setting="showFollowUps"> Show follow-up variations</label>
            </li>
        </ul>
    </aside>

    <section id="move-info" class="panel" aria-live="polite">
        <div class="move-info-header">
            <h2 id="move-title">Move Info</h2>
            <a id="josekipedia-link" href="https://www.josekipedia.com/" target="_blank" rel="noopener noreferrer">Open in Josekipedia ↗</a>
        </div>
        <div id="move-meta"></div>
        <div id="move-comment"></div>
    </section>

    <section id="follow-ups" class="panel" hidden>
        <div class="move-info-header">
            <h2>Follow-Up Variations</h2>
            <span class="note">Main line of each joseki move, numbered from the move</span>
        </div>
        <div id="follow-up-cards"></div>
    </section>
</main>
</body>
</html>
